name: Deploy docs to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      # The Pokedex and move pages are generated from the game data by the
      # extensions in docs/_ext/, so a data change has to redeploy the site
      # too. Keep this list in step with what those extensions read.
      - 'src/data/pokemon/**'
      - 'src/data/text/species_names.h'
      - 'src/data/graphics/pokemon.h'
      - 'src/data/pokemon_graphics/still_front_pic_table.h'
      - 'graphics/pokemon/**/front.png'
      - 'include/constants/tms_hms.h'
      - 'src/data/battle_moves.h'
      - 'src/data/contest_moves.h'
      - 'src/data/text/move_descriptions.h'
      - 'include/constants/pokemon.h'
      - 'src/data/wild_encounters.json'
      - 'include/constants/time_of_day.h'
      - 'data/maps/*/map.json'
      - 'data/maps/*/scripts.inc'
      - 'data/scripts/item_ball_scripts.inc'
      - 'src/data/trainers.h'
      - 'src/data/trainer_parties.h'
      - 'src/data/text/trainer_class_names.h'
      - 'src/data/items.h'
      - 'src/data/region_map/region_map_sections.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      - name: Build with Sphinx
        run: sphinx-build -W -b html docs _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
